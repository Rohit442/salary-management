spring:
  application:
    name: salary-management
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      settings:
        web-allow-others: false
  datasource:
    url: ${DB_URL:jdbc:h2:file:~/.acme-salary-management/salary-management;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      employeeCount: 10000
