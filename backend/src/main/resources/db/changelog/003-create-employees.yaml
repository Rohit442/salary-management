databaseChangeLog:
  - changeSet:
      id: 003-create-employees
      author: salary-management
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: full_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: work_email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: country_code
                  type: CHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: department
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: job_title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: job_level
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: employment_status
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: annual_base_salary
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: currency_code
                  type: CHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: joining_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: last_employment_date
                  type: DATE
              - column:
                  name: initial_annual_base_salary
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: initial_salary_effective_from
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: salary_effective_from
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE employee
              ADD CONSTRAINT ck_employee_salary CHECK (annual_base_salary > 0 AND initial_annual_base_salary > 0);
              ALTER TABLE employee ADD CONSTRAINT ck_employee_status CHECK (employment_status IN ('ACTIVE', 'INACTIVE'));
              ALTER TABLE employee ADD CONSTRAINT ck_employee_dates CHECK (last_employment_date IS NULL OR last_employment_date >= joining_date);
              ALTER TABLE employee ADD CONSTRAINT ck_employee_version CHECK (version >= 0)
