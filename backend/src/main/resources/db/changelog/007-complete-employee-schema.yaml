databaseChangeLog:
  - changeSet:
      id: "007-add-employee-creator"
      author: "salary-management"
      logicalFilePath: "db/changelog/007-complete-employee-schema.sql"
      # Accept only the recorded checksum of the original SQL migration.
      validCheckSum:
        - "9:5e4f4a04f470312ecbaf7255868f0432"
      changes:
        - addColumn:
            tableName: "employee"
            columns:
              - column:
                  name: "created_by_fk"
                  type: "BIGINT"
        - addColumn:
            tableName: "employee"
            columns:
              - column:
                  name: "created_by_display_name"
                  type: "VARCHAR(200)"
  - changeSet:
      id: "007-backfill-employee-creator"
      author: "salary-management"
      logicalFilePath: "db/changelog/007-complete-employee-schema.sql"
      # Accept only the recorded checksum of the original SQL migration.
      validCheckSum:
        - "9:1bfbbf1986683e54f20d7f137e33397a"
      changes:
        - update:
            tableName: "employee"
            columns:
              - column:
                  name: "created_by_fk"
                  valueComputed: "(SELECT id FROM hr_user WHERE work_email = 'seed@acme.example')"
              - column:
                  name: "created_by_display_name"
                  value: "Demo Data Seed"
            where: "created_by_fk IS NULL"
  - changeSet:
      id: "007-enforce-employee-relationships"
      author: "salary-management"
      logicalFilePath: "db/changelog/007-complete-employee-schema.sql"
      # Accept only the recorded checksum of the original SQL migration.
      validCheckSum:
        - "9:83e13ef473cefd07999bb57e3a7a0ed6"
      changes:
        - addNotNullConstraint:
            tableName: "employee"
            columnName: "created_by_fk"
            columnDataType: "BIGINT"
        - addNotNullConstraint:
            tableName: "employee"
            columnName: "created_by_display_name"
            columnDataType: "VARCHAR(200)"
        - modifyDataType:
            tableName: "employee"
            columnName: "full_name"
            newDataType: "VARCHAR(200)"
        - modifyDataType:
            tableName: "employee"
            columnName: "job_title"
            newDataType: "VARCHAR(200)"
        - modifyDataType:
            tableName: "employee"
            columnName: "job_level"
            newDataType: "VARCHAR(20)"
        - addForeignKeyConstraint:
            baseTableName: "employee"
            baseColumnNames: "created_by_fk"
            referencedTableName: "hr_user"
            referencedColumnNames: "id"
            constraintName: "fk_employee_creator"
        - addForeignKeyConstraint:
            baseTableName: "employee"
            baseColumnNames: "currency_code"
            referencedTableName: "currency"
            referencedColumnNames: "code"
            constraintName: "fk_employee_currency"
        - addUniqueConstraint:
            tableName: "employee"
            columnNames: "id, currency_code"
            constraintName: "uq_employee_id_currency"
        - sql:
            sql: "ALTER TABLE employee ADD CONSTRAINT ck_employee_email CHECK (work_email = LOWER(TRIM(work_email)) AND CHAR_LENGTH(work_email) > 0)"
        - sql:
            sql: "ALTER TABLE employee ADD CONSTRAINT ck_employee_identity CHECK (REGEXP_LIKE(employee_id, '^EMP-[0-9]{6}$'))"
        - sql:
            sql: "ALTER TABLE employee ADD CONSTRAINT ck_employee_name CHECK (CHAR_LENGTH(TRIM(full_name)) > 0)"
        - sql:
            sql: "ALTER TABLE employee ADD CONSTRAINT ck_employee_title CHECK (CHAR_LENGTH(TRIM(job_title)) > 0)"
        - sql:
            sql: "ALTER TABLE employee ADD CONSTRAINT ck_employee_creator_name CHECK (CHAR_LENGTH(TRIM(created_by_display_name)) > 0)"
        - sql:
            sql: "ALTER TABLE employee ADD CONSTRAINT ck_employee_effective_dates CHECK (\n    initial_salary_effective_from >= joining_date\n    AND salary_effective_from >= initial_salary_effective_from\n    AND (last_employment_date IS NULL OR salary_effective_from <= last_employment_date)\n)"
        - sql:
            sql: "ALTER TABLE employee ADD CONSTRAINT ck_employee_version_safe CHECK (version <= 9007199254740991)"
