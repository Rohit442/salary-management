databaseChangeLog:
  - changeSet:
      id: "008-create-salary-change"
      author: "salary-management"
      logicalFilePath: "db/changelog/008-create-salary-change.sql"
      # Accept only the recorded checksum of the original SQL migration.
      validCheckSum:
        - "9:3fccc7b13e6fd2205ead2d8a7e7701af"
      changes:
        - createTable:
            tableName: "salary_change"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "employee_fk"
                  type: "BIGINT"
                  constraints:
                    nullable: false
              - column:
                  name: "actor_fk"
                  type: "BIGINT"
                  constraints:
                    nullable: false
              - column:
                  name: "actor_display_name"
                  type: "VARCHAR(200)"
                  constraints:
                    nullable: false
              - column:
                  name: "previous_amount"
                  type: "DECIMAL(19,4)"
                  constraints:
                    nullable: false
              - column:
                  name: "new_amount"
                  type: "DECIMAL(19,4)"
                  constraints:
                    nullable: false
              - column:
                  name: "currency_code"
                  type: "CHAR(3)"
                  constraints:
                    nullable: false
              - column:
                  name: "reason"
                  type: "VARCHAR(1000)"
                  constraints:
                    nullable: false
              - column:
                  name: "effective_date"
                  type: "DATE"
                  constraints:
                    nullable: false
              - column:
                  name: "changed_at"
                  type: "TIMESTAMP WITH TIME ZONE"
                  constraints:
                    nullable: false
              - column:
                  name: "resulting_version"
                  type: "BIGINT"
                  constraints:
                    nullable: false
              - column:
                  name: "request_id"
                  type: "VARCHAR(36)"
                  constraints:
                    nullable: false
              - column:
                  name: "request_fingerprint"
                  type: "CHAR(64)"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "salary_change"
            baseColumnNames: "employee_fk, currency_code"
            referencedTableName: "employee"
            referencedColumnNames: "id, currency_code"
            constraintName: "fk_salary_change_employee_currency"
        - addForeignKeyConstraint:
            baseTableName: "salary_change"
            baseColumnNames: "actor_fk"
            referencedTableName: "hr_user"
            referencedColumnNames: "id"
            constraintName: "fk_salary_change_actor"
        - addForeignKeyConstraint:
            baseTableName: "salary_change"
            baseColumnNames: "currency_code"
            referencedTableName: "currency"
            referencedColumnNames: "code"
            constraintName: "fk_salary_change_currency"
        - addUniqueConstraint:
            tableName: "salary_change"
            columnNames: "actor_fk, request_id"
            constraintName: "uq_salary_change_actor_request"
        - addUniqueConstraint:
            tableName: "salary_change"
            columnNames: "employee_fk, resulting_version"
            constraintName: "uq_salary_change_employee_version"
        - addUniqueConstraint:
            tableName: "salary_change"
            columnNames: "employee_fk, effective_date"
            constraintName: "uq_salary_change_employee_effective"
        - sql:
            sql: "ALTER TABLE salary_change ADD CONSTRAINT ck_salary_change_amounts CHECK (previous_amount > 0 AND new_amount > 0 AND previous_amount <> new_amount)"
        - sql:
            sql: "ALTER TABLE salary_change ADD CONSTRAINT ck_salary_change_version CHECK (resulting_version BETWEEN 1 AND 9007199254740991)"
        - sql:
            sql: "ALTER TABLE salary_change ADD CONSTRAINT ck_salary_change_actor_name CHECK (CHAR_LENGTH(TRIM(actor_display_name)) > 0)"
        - sql:
            sql: "ALTER TABLE salary_change ADD CONSTRAINT ck_salary_change_reason CHECK (CHAR_LENGTH(TRIM(reason)) > 0)"
        - sql:
            sql: "ALTER TABLE salary_change ADD CONSTRAINT ck_salary_change_request_id CHECK (REGEXP_LIKE(request_id, '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))"
        - sql:
            sql: "ALTER TABLE salary_change ADD CONSTRAINT ck_salary_change_fingerprint CHECK (REGEXP_LIKE(request_fingerprint, '^[0-9a-f]{64}$'))"
  - changeSet:
      id: "008-index-salary-history"
      author: "salary-management"
      logicalFilePath: "db/changelog/008-create-salary-change.sql"
      # Accept only the recorded checksum of the original SQL migration.
      validCheckSum:
        - "9:fbba4014652784a52460ea5f72c1bf3a"
      changes:
        - createIndex:
            tableName: "salary_change"
            indexName: "ix_salary_change_history"
            columns:
              - column:
                  name: "employee_fk"
              - column:
                  name: "changed_at"
                  descending: true
              - column:
                  name: "id"
                  descending: true
