databaseChangeLog:
  - changeSet:
      id: 001-create-sample-message
      author: salary-management
      changes:
        - createTable:
            tableName: sample_message
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-seed-sample-message
      author: salary-management
      changes:
        - insert:
            tableName: sample_message
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: message
                  value: hello Rohit
  - include:
      file: db/changelog/003-create-employees.yaml
  - changeSet:
      id: 004-seed-demo-employees
      author: salary-management
      changes:
        - customChange:
            class: com.acme.salarymanagement.seed.EmployeeSeedChange
            param:
              - name: employeeCount
                value: ${employeeCount}
  - include:
      file: db/changelog/005-create-er-reference-tables.yaml
  - include:
      file: db/changelog/006-seed-er-reference-data.yaml
  - include:
      file: db/changelog/007-complete-employee-schema.yaml
  - include:
      file: db/changelog/008-create-salary-change.yaml
  - include:
      file: db/changelog/009-retire-sample-message.yaml
  - include:
      file: db/changelog/010-seed-demo-hr-user.yaml
  - include:
      file: db/changelog/011-auth-account-identity.yaml
  - include:
      file: db/changelog/012-salary-public-identity.yaml
